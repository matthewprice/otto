name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/bundle.py --check
      - run: python3 scripts/bundle.py --out dist
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: skill-bundles
          path: dist/
  plugin-validate:
    # Runs Claude Code's own manifest validator. The CLI is installed from npm and needs no login
    # for `plugin validate`. Seen green on the first run (2026-10-16), so it now fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
