name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/bundle.py --out dist
      - name: Create the GitHub release with the portable skill bundles attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.skill dist/*.zip dist/SHA256SUMS \
            --title "Otto $GITHUB_REF_NAME" --generate-notes
